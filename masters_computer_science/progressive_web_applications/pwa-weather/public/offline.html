<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style type="text/css">
        html{
            height: 100%;
        }
        body {
            height: 100%;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
        }
        .city {
            align-items: center;
            width: 80%;
            display: flex;
            justify-content: center;
            flex-direction: column;
            padding: 40px 8%;
            border-radius: 10px;
            background-color: #fff;
            font-size: 2em;
            margin-bottom: 20px;
        }
        .city-name {
            font-size: 1.5em;
            color: #333;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="city">
        <h2 class="city-name">Offline</h2>
        <p>It seems you are offline. Please check your internet connection and try again.</p>
    </div>
</body>
</html>
