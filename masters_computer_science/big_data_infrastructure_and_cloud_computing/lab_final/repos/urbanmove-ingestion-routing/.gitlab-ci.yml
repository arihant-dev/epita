image: golang:1.24

stages:
  - test
  - build
  - deploy

variables:
  SERVICE_NAME: urbanmove-ingestion-routing
  GO111MODULE: "on"

test:
  stage: test
  script:
    - go test ./...

build:
  stage: build
  script:
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/${SERVICE_NAME} ./cmd/${SERVICE_NAME}
    - tar -czf ${SERVICE_NAME}.tgz -C bin ${SERVICE_NAME}
  artifacts:
    paths:
      - ${SERVICE_NAME}.tgz

deploy:
  image: alpine:3.20
  stage: deploy
  when: manual
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - scp -o StrictHostKeyChecking=no ${SERVICE_NAME}.tgz ${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/
    - ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} 'bash -s' < deploy/deploy.sh
